<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light">
        <title>Ford Concesionaria - Contacto</title>
        <meta name="description" content="Contactate con nuestra concesionaria Ford oficial en Argentina. Completá el formulario y un asesor te responderá a la brevedad.">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../style/styles.css">
    </head>
    <body>
        <header>
            <div class="logo">
                <h1 class="nombre">Ford Concesionaria Oficial Argentina</h1>
                <a href="../index.html" class="logo-img">
                    <img class="img" src="../assets/logo-ford.webp" alt="Logo de Ford">
                </a>
            </div>
            <div class="navegacion">
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="menu-btn">MENU</label>
                <nav>
                    <ul>
                        <li><a href="../index.html">Inicio</a></li>
                        <li><a href="vehiculos.html">Vehículos</a></li>
                        <li><a href="usados.html">Usados</a></li>
                        <li><a href="contacto.html">Contacto</a></li>
                        <li><a href="quienes-somos.html">¿Quiénes Somos?</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main>
            <section class="contacto">
                <div class="cont-form">
                    <h2 class="contacto-titulo">Contactate con nosotros</h2>
                        <form>
                            <div class="row">
                            <div class="col">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Nombre" aria-label="nombre" required minlength="3">
                            </div>
                            <div class="col">
                                <label for="apellido" class="form-label">Apellido</label>
                                <input type="text" class="form-control" id="apellido" placeholder="Apellido" aria-label="apellido" required minlength="3">
                            </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="tucorreo@gmail.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="mensaje" class="form-label">Mensaje</label>
                                <textarea class="form-control" id="mensaje" rows="3" placeholder="Dejanos tu mensaje..." required></textarea>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" type="submit">Enviar</button>
                            </div>
                    </form>
                </div>
            </section>
        </main>
        <footer>
            <p>Contacto: fordconcesionaria@gmail.com<br>© 2026 Mi Sitio Web</p>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
